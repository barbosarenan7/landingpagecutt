<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#FAFAF8" />
    <!-- LCP: a foto do hero entra na fila junto com o HTML, sem esperar o
         React renderizar. AVIF cobre os navegadores modernos; nos raros
         sem suporte o <picture> ainda serve o JPEG (preload perdido, mas
         página correta). -->
    <link
      rel="preload"
      as="image"
      href="/hero-main-mobile.avif"
      media="(max-width: 640px)"
      fetchpriority="high"
    />
    <link
      rel="preload"
      as="image"
      href="/hero-main.avif"
      media="(min-width: 641px)"
      fetchpriority="high"
    />
    <!-- Satoshi agora é self-hosted (@font-face em styles.css); os dois
         pesos mais visíveis do primeiro paint entram com preload -->
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      href="/fonts/satoshi-900.woff2"
      crossorigin
    />
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      href="/fonts/satoshi-400.woff2"
      crossorigin
    />
    <title>Cut Creative — Marketing com método | Volta Redonda, RJ</title>
    <meta
      name="description"
      content="Agência de marketing estratégico em Volta Redonda: estratégia, social media, tráfego pago e produção audiovisual própria. Solicite um diagnóstico gratuito."
    />
    <meta property="og:title" content="Cut Creative — Marketing com método" />
    <meta
      property="og:description"
      content="Estratégia, social media, tráfego pago e audiovisual próprio para empresas que precisam crescer com consistência. Diagnóstico gratuito."
    />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="pt_BR" />
    <!--
      GTM: colar o snippet oficial aqui quando o container existir.
      IDs pendentes em src/config/site.ts ([CONFIRMAR]).
    -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
