    <meta charset="UTF-8" />
    <!-- Google Tag Manager, fora do caminho crítico.
         Os 296 KB de gtm.js + gtag.js competiam com a foto do hero na
         janela de pintura e eram o principal atraso de LCP no celular
         (PageSpeed: 5,7 s de render delay). O dataLayer nasce na hora,
         então nenhum push do site se perde; o script em si entra no
         primeiro toque/rolagem ou 1,5 s após o load, o que vier antes.
         Conversões continuam registrando: o gclid do clique no anúncio
         persiste e o evento sai logo depois da página pintar. -->
    <script>
      window.dataLayer = window.dataLayer || [];
      window.dataLayer.push({ "gtm.start": new Date().getTime(), event: "gtm.js" });
      (function () {
        var feito = false;
        function carrega() {
          if (feito) return;
          feito = true;
          var j = document.createElement("script");
          j.async = true;
          j.src = "https://www.googletagmanager.com/gtm.js?id=GTM-MQVRD3LX";
          document.head.appendChild(j);
        }
        function aposLoad() {
          setTimeout(carrega, 1500);
        }
        if (document.readyState === "complete") aposLoad();
        else window.addEventListener("load", aposLoad);
        ["pointerdown", "keydown", "touchstart", "scroll"].forEach(function (ev) {
          window.addEventListener(ev, carrega, { once: true, passive: true });
        });
      })();
    </script>
    <!-- End Google Tag Manager -->
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#FAFAF8" />
    <!-- LCP: a foto do hero entra na fila junto com o HTML, sem esperar o
         React renderizar. AVIF cobre os navegadores modernos; nos raros
         sem suporte o <picture> ainda serve o JPEG (preload perdido, mas
         página correta). -->
    <link
      rel="preload"
      as="image"
      href="/hero-main-mobile.avif"
      media="(max-width: 1023px)"
      fetchpriority="high"
    />
    <link
      rel="preload"
      as="image"
      href="/hero-main.avif"
      media="(min-width: 1024px)"
      fetchpriority="high"
    />
